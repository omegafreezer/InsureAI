services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insureai
      POSTGRES_USER: insureai
      POSTGRES_PASSWORD: insureai_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureai -d insureai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://insureai:insureai_dev_password@db:5432/insureai
      JWT_SECRET: change-this-before-production
      ACCESS_TOKEN_MINUTES: 120
      AUTO_APPROVAL_THRESHOLD: 35
      INVESTIGATION_THRESHOLD: 65
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
